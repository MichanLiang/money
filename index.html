<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>錢帳本</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
    </div>
    <h1 class="login-title">錢帳本</h1>
    <p class="login-sub">把每一分錢，分進它該去的地方。</p>
    <button class="login-btn" id="googleLoginBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.68-3.87 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      使用 Google 登入
    </button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appShell">
  <header class="app-header">
    <div class="header-top">
      <div class="greet">你好，<b id="userNameDisplay">同學</b></div>
      <div class="header-total">
        <div class="total-label">總資產</div>
        <div class="total-amount mono">$<span id="totalBalance">0</span></div>
      </div>
    </div>
    <div class="header-curve"></div>
  </header>

  <main>
    <!-- ---------- 記帳 PAGE ---------- -->
    <section class="page active" id="page-record">
      <div class="section-title">記一筆</div>
      <div class="card">
        <div class="type-toggle">
          <button class="type-btn" data-type="expense" data-active="true">支出</button>
          <button class="type-btn" data-type="income" data-active="false">收入</button>
          <button class="type-btn" data-type="transfer" data-active="false">轉帳</button>
        </div>

        <div class="field-label">金額</div>
        <input type="number" class="amount-input" id="txAmount" placeholder="0" inputmode="decimal">

        <div class="row-2" id="acctFieldWrap">
          <div>
            <div class="field-label" id="fromLabel">存錢處</div>
            <select id="txAccount"></select>
          </div>
          <div id="toAccountWrap" style="display:none;">
            <div class="field-label">轉入</div>
            <select id="txToAccount"></select>
          </div>
        </div>

        <div id="categoryWrap">
          <div class="field-label">用途</div>
          <div class="cat-pill-wrap" id="txCatWrap"></div>
        </div>

        <div class="field-label">備註</div>
        <input type="text" id="txNote" placeholder="午餐、公車、衛生紙⋯⋯">

        <button class="submit-btn" id="submitTxBtn">記錄</button>
      </div>

      <div class="section-title">最近紀錄</div>
      <div id="txList"></div>
    </section>

    <!-- ---------- 圖表 PAGE ---------- -->
    <section class="page" id="page-chart">
      <div class="section-title">各存錢處餘額</div>
      <div class="balance-grid" id="balanceGrid"></div>

      <div class="section-title">本月支出</div>
      <div class="chart-card">
        <canvas id="pieChart" height="200"></canvas>
        <div id="pieEmptyHint" class="empty-hint" style="display:none;">本月還沒有支出紀錄</div>
      </div>

      <div class="section-title">預算進度</div>
      <div class="chart-card" id="budgetProgressWrap"></div>
    </section>

    <!-- ---------- 設定 PAGE ---------- -->
    <section class="page" id="page-settings">
      <div class="section-title">設定</div>
      <div class="settings-card">
        <div class="settings-label">顯示名稱</div>
        <input type="text" id="settingsNameInput" style="margin-bottom:16px;">
        <div class="settings-label">主題色</div>
        <div class="theme-swatches" id="themeSwatches"></div>
      </div>

      <div class="section-title">存錢處</div>
      <div class="settings-card" id="acctManageCard"></div>
      <button class="small-btn" id="addAcctBtn" style="width:100%;margin-bottom:8px;">＋ 新增存錢處</button>

      <div class="section-title">分項管理</div>
      <div class="settings-card">
        <div class="settings-label">選擇存錢處</div>
        <select id="catManageAcctSelect" style="margin-bottom:12px;"></select>
        <div class="cat-manage-list" id="catManageList"></div>
        <button class="small-btn" id="addCatBtn" style="width:100%;margin-top:12px;">＋ 新增分項</button>
      </div>

      <div class="section-title">資料</div>
      <div class="settings-card">
        <button class="small-btn danger-text" id="resetDataBtn" style="width:100%;">清空所有資料</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-page="page-record" data-active="true">
      <span class="nav-ic"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
      記帳
    </button>
    <button class="nav-btn" data-page="page-chart" data-active="false">
      <span class="nav-ic"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></span>
      圖表
    </button>
    <button class="nav-btn" data-page="page-settings" data-active="false">
      <span class="nav-ic"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
      設定
    </button>
  </nav>
</div>

<div class="stamp-fx" id="stampFx">✓</div>

<!-- Add account modal -->
<div class="modal-bg" id="acctModal">
  <div class="modal-box">
    <span class="modal-close" id="closeAcctModal">×</span>
    <div class="modal-title">新增存錢處</div>
    <div class="field-label">名稱</div>
    <input type="text" id="newAcctName" placeholder="銀行帳戶、零用錢包" style="margin-bottom:14px;">
    <div class="field-label">起始金額</div>
    <input type="number" id="newAcctBalance" placeholder="0" style="margin-bottom:14px;">
    <div class="field-label">選一個圖示</div>
    <div class="icon-choice-wrap" id="newAcctIconWrap"></div>
    <button class="submit-btn" id="confirmAddAcctBtn" style="margin-top:18px;">建立</button>
  </div>
</div>

<!-- Name modal -->
<div class="modal-bg" id="nameModal">
  <div class="modal-box">
    <div class="modal-title">怎麼稱呼你？</div>
    <div class="field-label">你的名字</div>
    <input type="text" id="nameModalInput" placeholder="輸入你的名字">
    <button class="submit-btn" id="confirmNameBtn" style="margin-top:14px;">確認</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
